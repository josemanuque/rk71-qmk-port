name: Build firmware

# Every push and pull request: build the firmware and keep it as a downloadable artifact.
# Pushing a version tag (v0.6.0b, v1.0.0, …): also publish a GitHub Release with the images attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

env:
  QMK_COMMIT: c9f3803f # SonixQMK commit this port is built and tested against (also in tools/build.sh)
  ARM_TOOLCHAIN: 12.2.mpacbti-rel1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The exact toolchain the firmware was developed and tested with, so CI images match local builds
      # byte for byte (apart from the build date). 12.2.Rel1 also works, but its C library differs.
      - name: Arm GNU toolchain cache
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN }}

      - name: Download Arm GNU toolchain
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -sSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

      - name: Add toolchain to PATH
        run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          ~/arm-gnu-toolchain/bin/arm-none-eabi-gcc --version | head -1

      - name: SonixQMK checkout (cached)
        id: qmk-cache
        uses: actions/cache@v4
        with:
          path: qmk_firmware
          key: sonixqmk-${{ env.QMK_COMMIT }}

      - name: Clone SonixQMK
        if: steps.qmk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/SonixQMK/qmk_firmware.git qmk_firmware
          git -C qmk_firmware checkout "$QMK_COMMIT"
          git -C qmk_firmware submodule update --init --recursive

      - name: qmk CLI
        run: python3 -m pip install --quiet qmk -r qmk_firmware/requirements.txt

      - name: Build
        run: |
          ver="${GITHUB_REF_NAME//\//-}"
          bash tools/build.sh via "out/rk71_rgb_${ver}.bin"
          bash tools/build.sh default "out/rk71_rgb_${ver}_default-keymap.bin"
          cp via/rk71_rgb_via.json out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          mkdir -p debug && cp qmk_firmware/.build/*.elf qmk_firmware/.build/*.map debug/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: rk71_rgb-${{ github.sha }}
          path: out/

      - uses: actions/upload-artifact@v4
        with:
          name: debug-elf-${{ github.sha }}
          path: debug/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *b | *-beta* | *-rc*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* $pre --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" out/* --clobber
